<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Velora</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-black text-white">
    <header
      class="fixed top-0 left-0 w-full z-50 bg-black/70 backdrop-blur-lg border-b border-gray-800"
    >
      <nav
        class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between"
      >
        <a href="home.html" class="text-3xl font-bold tracking-widest">
          VELORA
        </a>

        <ul
          class="hidden md:flex items-center gap-8 text-sm uppercase tracking-wider"
        >
          <li><a href="home.html" class="hover:text-gray-400">Home</a></li>
          <li><a href="about.html" class="hover:text-gray-400">About</a></li>
          <li><a href="store.html" class="hover:text-gray-400">Store</a></li>
          <li>
            <a href="contact.html" class="hover:text-gray-400">Contact</a>
          </li>
        </ul>

        <button id="menuBtn" class="md:hidden text-3xl">☰</button>
      </nav>

      <!-- Mobile Menu -->
      <div
        id="mobileMenu"
        class="hidden md:hidden bg-black border-t border-gray-800"
      >
        <ul class="flex flex-col p-6 gap-5 uppercase text-sm tracking-wider">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="store.html">Store</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <section class="min-h-screen flex items-center justify-center px-6 py-20">
      <div class="max-w-5xl w-full grid lg:grid-cols-2 gap-16 items-center">
        <div>
          <p class="uppercase tracking-[8px] text-sm text-gray-400 mb-4">
            Contact Us
          </p>

          <h1 class="text-5xl font-black mb-6 leading-tight">
            Let's Talk Fashion
          </h1>

          <p class="text-gray-300 leading-relaxed text-lg">
            Reach out to us for fashion inquiries, orders, collaborations, and
            support.
          </p>
        </div>

        <form class="bg-white text-black rounded-3xl p-8 shadow-2xl">
          <div class="mb-5">
            <input
              type="text"
              placeholder="Full Name"
              class="w-full border border-gray-300 rounded-xl px-4 py-4 outline-none"
            />
          </div>

          <div class="mb-5">
            <input
              type="email"
              placeholder="Email Address"
              class="w-full border border-gray-300 rounded-xl px-4 py-4 outline-none"
            />
          </div>

          <div class="mb-5">
            <textarea
              rows="5"
              placeholder="Your Message"
              class="w-full border border-gray-300 rounded-xl px-4 py-4 outline-none"
            ></textarea>
          </div>

          <button
            class="bg-black text-white w-full py-4 rounded-full hover:bg-gray-800 transition"
          >
            Send Message
          </button>
        </form>
      </div>
    </section>
  </body>
</html>
